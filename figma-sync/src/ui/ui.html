<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body { font: 12px/1.4 -apple-system, sans-serif; margin: 0; padding: 12px; color: #1a1a1a; }
  h2 { font-size: 13px; margin: 16px 0 6px; }
  fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin: 0 0 8px; }
  label { display: block; margin-top: 6px; font-size: 11px; color: #555; }
  input { width: 100%; box-sizing: border-box; padding: 4px; font-size: 12px; }
  button { margin: 8px 6px 0 0; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #log { white-space: pre-wrap; background: #f5f5f5; border-radius: 6px; padding: 8px; max-height: 160px; overflow: auto; font-family: monospace; font-size: 11px; }
  .entry { margin-bottom: 6px; }
  .error { color: #c0392b; }
</style>
</head>
<body>
  <h2>Settings</h2>
  <fieldset>
    <label>GitHub token</label>
    <input id="token" type="password" />
    <label>Owner</label>
    <input id="owner" />
    <label>Repo</label>
    <input id="repo" />
    <label>Branch</label>
    <input id="branch" value="main" />
    <label>Brand</label>
    <input id="brand" value="core" />
    <button id="save-settings">Save</button>
  </fieldset>

  <h2>Sync</h2>
  <button id="pull">Pull from GitHub</button>
  <button id="reconcile">Check status</button>
  <button id="post-publish">Post-publish sync</button>

  <h2>Push selection</h2>
  <button id="load-selection">Load selection</button>
  <div id="mapping"></div>
  <button id="prepare-push" style="display:none">Prepare push</button>
  <div id="plan"></div>
  <button id="confirm-push" style="display:none">Confirm commit</button>
  <button id="cancel-push" style="display:none">Cancel</button>

  <h2>Log</h2>
  <div id="log"></div>

  <script src="./ui.js"></script>
</body>
</html>
